name: Build Release

# 注意：自 2026-09-24 起本流程只构建 iOS（未签名 IPA）。
# omnihub 的分发模型是「iOS 底包 + Shorebird 热更新」，Android 从未成功
# 发布过（缺签名 secrets）且不再需要，相关构建 job 已移除。若未来恢复
# Android 发版，需补配 ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
# KEY_ALIAS / KEY_PASSWORD 四个 secrets 并恢复 build-android 作业。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      release_name: ${{ steps.meta.outputs.release_name }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      ipa_name: ${{ steps.meta.outputs.ipa_name }}
      ipa_sha_name: ${{ steps.meta.outputs.ipa_sha_name }}
      ipa_url: ${{ steps.meta.outputs.ipa_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | sed 's/+.*//' | tr -d ' ')
          BUILD_DATE=$(date +%Y-%m-%d)
          RELEASE_NAME="v${VERSION}-${BUILD_DATE}"
          TAG_NAME="release-${RELEASE_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=ios-${RELEASE_NAME}.ipa" >> "$GITHUB_OUTPUT"
          echo "ipa_sha_name=ios-${RELEASE_NAME}.ipa.sha256" >> "$GITHUB_OUTPUT"
          echo "ipa_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/ios-${RELEASE_NAME}.ipa" >> "$GITHUB_OUTPUT"

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/flutter
          key: ${{ runner.os }}-flutter-3.38.2-${{ hashFiles('.github/workflows/build-release.yml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-3.38.2-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: "stable"
          cache: true
          cache-key: flutter-3.38.2-${{ hashFiles('pubspec.lock') }}

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        env:
          TYPHOEUS_HTTP_VERSION: CURL_HTTP_VERSION_1_1
        run: |
          cd ios
          pod install || pod install --repo-update

      - name: Cache Xcode derived data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            build
          key: ${{ runner.os }}-xcode-${{ hashFiles('ios/Podfile.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ hashFiles('ios/Podfile.lock') }}-
            ${{ runner.os }}-xcode-

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --obfuscate \
            --split-debug-info=build/symbols/ios \
            --dart-define=FLUTTER_APP_ENV=release \
            --dart-define=GITHUB_ACTIONS_TOKEN="${{ secrets.ACTIONS_TOKEN || secrets.GITHUB_ACTIONS_TOKEN }}"

          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r -y "${{ needs.prepare.outputs.ipa_name }}" Payload
          shasum -a 256 "${{ needs.prepare.outputs.ipa_name }}" > "${{ needs.prepare.outputs.ipa_sha_name }}"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            build/ios/iphoneos/${{ needs.prepare.outputs.ipa_name }}
            build/ios/iphoneos/${{ needs.prepare.outputs.ipa_sha_name }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show release files
        shell: bash
        run: ls -lah dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          body: |
            MoviePilot Release

            - Version: ${{ needs.prepare.outputs.version }}
            - Build Date: ${{ needs.prepare.outputs.build_date }}
            - iOS: Unsigned IPA

            iOS 安装说明：
            - IPA 为未签名包
            - 请使用自己的 Apple Developer 账号通过 AltStore、Sideloadly 或 Xcode 进行签名安装

            说明：自 2026-09-24 起仅发布 iOS，不再构建 Android 安装包。
          files: |
            dist/${{ needs.prepare.outputs.ipa_name }}
            dist/${{ needs.prepare.outputs.ipa_sha_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Telegram 通知
        uses: ./.github/actions/telegram-notify
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          chat_id: ${{ secrets.TG_CHAT_ID }}
          message: |
            <b>🎬 MoviePilot 构建完成</b>

            <b>Release:</b> <code>${{ needs.prepare.outputs.release_name }}</code>
            <b>版本:</b> ${{ needs.prepare.outputs.version }}
            <b>日期:</b> ${{ needs.prepare.outputs.build_date }}

            <b>附件:</b> 已附带 iOS 未签名 IPA 安装包。
            <b>说明:</b> IPA 为未签名包，需自行签名安装；自 2026-09-24 起仅发布 iOS。

            <a href="https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag_name }}">📦 查看 Release</a>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">🔗 Workflow 运行</a>
          file_urls: |
            ${{ needs.prepare.outputs.ipa_url }}
