name: Upstream Sync Monitor

on:
  schedule:
    - cron: "0 2 * * *" # 每天北京时间 10:00 自动巡检
  workflow_dispatch: # 支持手动一键触发

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Upstream Release & Notify
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            
            // 1. 读取本地记录的上游基准
            let baselineTag = "release-v1.2.5";
            let upstreamRepo = "singleton-altman/MoviePilotLite";
            try {
              if (fs.existsSync("upstream_baseline.json")) {
                const raw = fs.readFileSync("upstream_baseline.json", "utf8");
                const parsed = JSON.parse(raw);
                baselineTag = parsed.baseline_tag || baselineTag;
                upstreamRepo = parsed.upstream_repo || upstreamRepo;
              }
            } catch (err) {
              console.log("读取 upstream_baseline.json 异常，使用缺省值", err);
            }

            console.log(`当前本地记录的上游基线: ${baselineTag}`);

            // 2. 查询上游仓库最新 Release
            const [owner, repo] = upstreamRepo.split("/");
            let latestRelease;
            try {
              const res = await github.rest.repos.getLatestRelease({
                owner,
                repo,
              });
              latestRelease = res.data;
            } catch (err) {
              console.error("获取上游最新 Release 失败:", err);
              return;
            }

            const latestTag = latestRelease.tag_name;
            console.log(`上游最新 Release: ${latestTag}`);

            if (latestTag === baselineTag) {
              console.log("上游无新版本，与基线完全一致，无需提醒。");
              return;
            }

            // 3. 检查是否已经为该版本创建过 Issue
            const issueTitle = `[上游更新提醒] MoviePilotLite 发布新版本 ${latestTag}`;
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "upstream-update",
            });

            const alreadyNotified = existingIssues.data.some(i => i.title.includes(latestTag));
            if (alreadyNotified) {
              console.log(`已存在版本 ${latestTag} 的开放提醒 Issue，跳过重复创建。`);
              return;
            }

            // 4. 创建提醒 Issue 触发移动端通知
            const releaseBody = latestRelease.body || "（上游未填写详细说明）";
            const issueBody = [
              "### 🚀 上游 MoviePilotLite 发布新版本！",
              `- **上游版本**: \`${latestTag}\` (${latestRelease.name || latestTag})`,
              `- **当前 OmniHub 基线**: \`${baselineTag}\``,
              `- **发布时间**: ${latestRelease.published_at}`,
              `- **上游发布主页**: [查看上游 Release](${latestRelease.html_url})`,
              "",
              "---",
              "",
              "### 📝 上游更新日志",
              "```markdown",
              releaseBody.slice(0, 2000),
              "```",
              "",
              "---",
              "",
              "### 🤖 大模型一键同步指引",
              "收到此通知后，打开 Antigravity / 您的 AI 编程助手，直接输入以下提示词即可全自动完成合并：",
              "",
              `> **请帮我同步 MoviePilotLite 上游最新版本 \`${latestTag}\` 到 OmniHub，保留自研模块（Dian115、JAV、自定义应用设置与热更配置），并完成构建校验！**`
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ["upstream-update"],
            });

            console.log(`已成功创建提醒 Issue: ${issueTitle}`);

